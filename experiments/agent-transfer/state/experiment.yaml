experiment_id: ssd-agent-transfer-001
status: active
stage: first_ssd_transfer_pair

sot:
  repository: marxwood/semantic-system-design
  branch: experiment-ssd-transfer
  experiment_root: experiments/agent-transfer
  state_path: experiments/agent-transfer/state/experiment.yaml
  write_policy: experiment_branch_only

authority:
  coordinator_role: chatgpt-coordinator
  human_required_for:
    - authored_ssd_semantic_change
    - new_foundational_ssd_claim
    - human_authority_boundary_change
    - authoritative_external_publication

source_state:
  ssd_authored_source_commit: b60d269a2138e37000dbb8b848eb38882f2b915f
  ssd_skill_merge_commit: a2b4b53548af68ae2e83959a315a7b07cb67b3a8
  skill_path: skills/ssd/SKILL.md
  validation_path: skills/ssd/source-map.md

safe_stop:
  active: false
  reason: null

agents:
  chatgpt-coordinator:
    role: coordinator
    runtime_binding: runnable
    activation_mode: github_pr_event_trigger
    event_scope:
      repository: marxwood/semantic-system-design
      base_branch: experiment-ssd-transfer
      eligible_events:
        - pull_request_opened
        - pull_request_ready_for_review
        - pull_request_synchronize
      ignored_events:
        - pull_request_merged
        - pull_request_closed
        - issue_comment
        - pull_request_review
        - reaction
        - non_experiment_base_branch
        - coordinator_generated_side_effect
    capability_note: ChatGPT Work Monitoring is event-driven for proposal-changing activity on open PRs targeting experiment-ssd-transfer. The runtime applies the hard routing gate before SOT reconciliation; the separate hourly fallback watcher is disabled while event scope is stabilized.
  codex-architect:
    role: participant_architect
    runtime_binding: unbound
    activation_mode: null
  claude-architect:
    role: participant_architect
    runtime_binding: unbound
    activation_mode: null
  hermes-runtime:
    role: participant_architect_and_runtime_candidate
    runtime_binding: runnable
    activation_mode: github_push_webhook
    capability_note: Hermes gateway receives signed GitHub push events, reduces payloads to untrusted wake-up tokens, reconstructs authority from current experiment SOT, and writes claims/outcomes through PRs. Duplicate or stale delivery is a no-op unless current SOT exposes eligible work.
  chatgpt-evaluator:
    role: evaluator
    runtime_binding: runnable
    activation_mode: coordinator_invoked_clean_context_from_sot
    capability_note: A fresh isolated agent invocation reconstructs authority from current SOT, receives only its assigned evaluation inputs and evaluator-only material, safely no-ops when no evaluation is authorized, and writes evidence through GitHub without participant or coordinator conversation context.

